server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:lumogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      # Tylko do lokalnego debugowania na H2: H2_CONSOLE_ENABLED=true
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    org.springframework: INFO

app:
  jwt:
    # Na serwerze ustaw JWT_SECRET (min. 32 znaki), np. wynik: openssl rand -base64 48
    secret: ${JWT_SECRET:lumogo-dev-secret-change-me-before-deploy-0123456789}
    ttl-days: ${JWT_TTL_DAYS:30}